# http://localhost:7000/
name: realwaste
services:
  api:
    build:
      context: ..
      dockerfile: src/predict/Dockerfile
    ports:
      - "7001:8000"

  frontend:
    build:
      context: ..
      dockerfile: src/load/Dockerfile
      args:
        VITE_URL_EP: http://localhost:7001
    ports:
      - "7000:80"
    depends_on:
      - api